name: Release
on:
  push:
    tags: ['v*']

# Default to read for the workflow; the release job opts up to contents: write
# because it publishes release artifacts.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Read from go.mod rather than a separate pin, so releases are built with
      # the toolchain the module declares.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
