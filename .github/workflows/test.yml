name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Read the version from go.mod rather than pinning it here. The pin said
      # 1.22 while go.mod required 1.25, which only worked because Go silently
      # downloads a newer toolchain — so CI was not testing the declared version.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The ElectrumX UTXO cache is shared between the polling goroutine and
      # caller threads, so a data race there is a correctness bug in the money
      # path rather than a stylistic concern.
      - name: Test with race detector
        run: go test -race ./...

      - name: Coverage
        run: go test -cover ./...
