name: Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the repository. Without an explicit
# block the job inherits the repository or organization default, which is
# read-write on anything created before February 2023.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Read the version from go.mod rather than pinning it separately, so CI
      # always builds with the toolchain the module declares.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The ElectrumX UTXO cache is shared between the polling goroutine and
      # caller threads, so a data race there is a correctness bug in the money
      # path rather than a stylistic concern.
      - name: Test with race detector
        run: go test -race ./...

      - name: Coverage
        run: go test -cover ./...

      # No compiler reads a Markdown fence, so documentation can drift from the
      # code while every job above stays green. This compiles the snippets,
      # resolves API references against the real packages, and checks anchors.
      - name: Documentation
        run: python3 scripts/check-docs.py

      # Known-vulnerability scan against the Go vulnerability database, on the
      # symbols this module actually calls, not just the module graph.
      - name: Vulnerability scan
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-file: go.mod
          go-package: ./...

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Scans the full history for committed credentials. An exchange's own
      # scanner will run this against us; better that it finds nothing new.
      # The gitleaks GitHub Action requires a paid license for organisation
      # repositories; the gitleaks CLI itself is MIT-licensed, so run that.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --exit-code 1 --verbose
