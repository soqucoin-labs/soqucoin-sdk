name: Register

# The writing rules for this repository's own text: pull request title and body, our
# comments, commit messages, and changed file names. They held by convention until now, and a
# convention holds until the moment someone is in a hurry. This check runs on the platform, so
# it also covers a body edited in the web interface and a comment posted from a phone.
#
# `edited` is in the list on purpose: editing a body publishes new text, and that is the step
# a local check placed before a command never sees.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  register:
    # An issue_comment event fires for issues as well as pull requests; only the pull request
    # case has text this check is about.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The corpus runs first. A check whose own fixtures fail would otherwise pass every
      # pull request and read as a green tick.
      - run: python3 .github/scripts/register-lint-selftest.py
      - run: python3 .github/scripts/register-lint.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
