name: Register

# The writing rules for this repository's own text: pull request title and body, our
# comments, commit messages, and changed file names. They held by convention until now, and a
# convention holds until the moment someone is in a hurry. This check runs on the platform, so
# it also covers a body edited in the web interface and a comment posted from a phone.
#
# `edited` is in the list on purpose: editing a body publishes new text, and that is the step
# a local check placed before a command never sees.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  register:
    # An issue_comment event fires for issues as well as pull requests; only the pull request
    # case has text this check is about.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      # The checker comes from the BASE of the pull request, never from the pull request.
      # On a pull_request event actions/checkout defaults to the merge ref, so the default
      # would run the copy of the checker that the pull request itself ships: a change to
      # that file, or to this workflow, could make the check pass without checking any text.
      # A pull request cannot alter its own base. On an issue_comment event GitHub already
      # runs the default branch's workflow, and the fallback below resolves to it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
      # The corpus runs first. A checker whose own fixtures fail would otherwise pass every
      # pull request and read as a green tick.
      #
      # A base with no checker fails the job rather than skipping it. Skipping would be the
      # same fail-open shape this whole check exists to remove, and the one moment it costs
      # anything is the change that installs the checker, whose own run has no trusted copy
      # to use. That merge is reviewed by hand.
      - name: Lint the text of this pull request
        run: |
          test -f .github/scripts/register-lint.py || {
            echo "::error title=Register check::the base of this pull request carries no register checker, so there is no trusted copy to run, and this fails closed. Expected only for the change that installs the checker."
            exit 1
          }
          python3 .github/scripts/register-lint-selftest.py
          python3 .github/scripts/register-lint.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The step above proves nothing about the checker this pull request ships, because it
      # never runs it. A diff that weakens a pattern therefore passes its own run and takes
      # effect on every pull request after it merges, and the only thing in front of that is
      # someone reading the diff.
      #
      # So run the BASE corpus against the HEAD checker. The corpus resolves the checker from
      # its own directory, so copying the base corpus in beside the head checker is the whole
      # mechanism. A pull request that weakens a pattern fails here, because the base fixture
      # for that pattern still demands the block. Weakening the checker and its fixture in the
      # same pull request fails too: the fixture that runs is the base's. Getting a weaker
      # checker in takes two merges, the first of which deletes a fixture and nothing else.
      #
      # The cost is that tightening a pattern so that it reclassifies an existing positive
      # fixture also takes two merges. That is rare, and it is deliberate when it happens.
      #
      # The cases this step is meant to catch are fixtures, not a claim in this comment:
      # .github/scripts/register-crossrun-selftest.py, run by the Test workflow.
      #
      # This executes a file from the head, so it is confined to `pull_request`, which carries
      # a read-only token and no secrets, and it is given no token of its own.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - name: The base corpus against this pull request's checker
        if: github.event_name == 'pull_request'
        run: |
          test -f head/.github/scripts/register-lint.py || {
            echo "::error title=Register check::this pull request removes or renames the register checker, so the base corpus has nothing to run against, and this fails closed."
            exit 1
          }
          cp .github/scripts/register-lint-selftest.py head/.github/scripts/
          python3 head/.github/scripts/register-lint-selftest.py
